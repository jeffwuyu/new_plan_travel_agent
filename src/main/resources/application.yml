# 中文注释：应用配置文件，用于声明服务运行所需的环境参数与开关。
spring:
  application:
    name: travel-agent

  config:
    import: optional:file:./key.yml

  # ==================== Multipart Upload ====================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  # ==================== DataSource (HikariCP) ====================
  datasource:
    url: jdbc:mysql://localhost:3306/travel_agent?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TravelAgentPool
      connection-test-query: SELECT 1
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-runtime.sql

  # ==================== Redis ====================
  data:
    redis:
      host: 127.0.0.1
      port: 6379
#      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

  # ==================== Cache ====================
  cache:
    type: caffeine
    # Individual region TTLs are managed in CacheConfig.java

  # ==================== Jackson ====================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Shanghai

server:
  port: 8123
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    async-timeout: 600000

# ==================== MyBatis ====================
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.travelagent.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false
    default-statement-timeout: 30

# ==================== PageHelper ====================
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ==================== Knife4j (springdoc-openapi 2.x) ====================

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.travelagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# ==================== JWT ====================
jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# ==================== Dashscope (Tongyi Qianwen) ====================
dashscope:
  api-key: ${secret.api-dashscope-key}
  llm:
    model: qwen-plus
    temperature: 0.7
  embedding:
    model: text-embedding-v3
  timeout: 60000
  max-retries: 3

# ==================== Amap ====================
amap:
  api-key: ${secret.api-amap-key}
  geocode-url: https://restapi.amap.com/v3/geocode/geo
  weather-url: https://restapi.amap.com/v3/weather/weatherInfo
  direction-url: https://restapi.amap.com/v3/direction/driving
  walking-direction-url: https://restapi.amap.com/v3/direction/walking
  nearby-search-url: https://restapi.amap.com/v3/place/around
  timeout: 10000

# ==================== Alibaba Cloud OSS ====================
oss:
  endpoint: https://oss-cn-beijing.aliyuncs.com
  access-key-id: ${secret.oss-access-key-id}
  access-key-secret: ${secret.oss-access-key-secret}
  bucket-name: travel-agent-docs
  rag-prefix: rag/documents/

# ==================== DashVector ====================
dashvector:
  api-key: ${secret.dashvector-api-key}
  endpoint: ${secret.endpoint}
  collection: travel
  dimension: 1536
  top-k: 5

# ==================== Agent ====================
agent:
  task:
    thread-pool-size: 4
    queue-size: 100
    poll-interval-ms: 2000
    max-per-poll: 4
  history:
    max-tokens: 3000
    sliding-window: 6
  planner:
    max-steps: 30
    same-day-radius-km: 30
  mcp:
    enabled: false
    protocol-version: 2025-03-26
    startup-timeout-ms: 10000
    request-timeout-ms: 10000
    server:
      command: npx
      args:
        - -y
        - "@amap/amap-maps-mcp-server"
      env:
        AMAP_MAPS_API_KEY: ${secret.api-amap-key}
    tool-mapping:
      geocode: maps_geo
      weather: maps_weather
      traffic_time: maps_direction_driving

# ==================== Rate Limit ====================
ratelimit:
  anonymous:
    hourly-limit: 10

# ==================== Quota defaults ====================
quota:
  regular:
    daily-tokens: 10000
    monthly-tokens: 100000
    max-concurrent-tasks: 2
    max-plan-steps: 15
  vip:
    daily-tokens: 50000
    monthly-tokens: 500000
    max-concurrent-tasks: 5
    max-plan-steps: 30
  admin:
    daily-tokens: 999999
    monthly-tokens: 9999999
    max-concurrent-tasks: 10
    max-plan-steps: 50

# ==================== Logging ====================
logging:
  level:
    root: INFO
    com.travelagent: INFO
    io.lettuce: WARN
    io.netty: WARN
    org.mybatis: INFO
    com.aliyun: INFO
    org.springframework.ai: INFO
    org.springdoc: WARN
  file:
    name: logs/travel-agent.log
